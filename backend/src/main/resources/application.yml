spring:
  application:
    name: cifra-api

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/cifra}
    username: ${DATABASE_USER:cifra}
    password: ${DATABASE_PASSWORD:cifra}
    hikari:
      pool-name: cifra-pool
      maximum-pool-size: ${DB_POOL_SIZE:10}

  jpa:
    hibernate:
      # O schema pertence ao Flyway. O Hibernate so confere se bate.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # Demo publica: a saude do banco faz parte do que se quer mostrar.
      show-details: always
      probes:
        enabled: true

server:
  port: ${PORT:8080}
  shutdown: graceful

logging:
  level:
    com.cifra: ${LOG_LEVEL:INFO}
