spring:
  application:
    name: cifra-api

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/cifra}
    username: ${DATABASE_USER:cifra}
    password: ${DATABASE_PASSWORD:cifra}
    hikari:
      pool-name: cifra-pool
      maximum-pool-size: ${DB_POOL_SIZE:10}

  jpa:
    hibernate:
      # O schema pertence ao Flyway. O Hibernate so confere se bate.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

  jackson:
    default-property-inclusion: non_null

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}

cifra:
  url-base: ${APP_URL:http://localhost:8080}

  jwt:
    # Padrao serve so para desenvolvimento. Em producao vem do ambiente, e a
    # aplicacao recusa subir com menos de 32 bytes.
    segredo: ${JWT_SECRET:desenvolvimento-troque-este-segredo-de-32-bytes-ou-mais}
    validade-do-acesso: PT15M
    validade-do-refresh: P7D

  email:
    remetente: ${MAIL_FROM:nao-responda@cifra.local}
    validade-da-verificacao: PT24H

  login:
    tentativas-por-janela: 5
    janela: PT15M

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # Demo publica: a saude do banco faz parte do que se quer mostrar.
      show-details: always
      probes:
        enabled: true
  health:
    mail:
      # SMTP fora do ar nao torna a aplicacao doente: o envio de verificacao
      # degrada sozinho (o link fica no log) e todo o resto segue funcionando.
      # Sem isto, um servidor de e-mail indisponivel devolve 503 no health e
      # tira a aplicacao do ar em qualquer orquestrador.
      enabled: false

server:
  port: ${PORT:8080}
  shutdown: graceful

logging:
  level:
    com.cifra: ${LOG_LEVEL:INFO}
